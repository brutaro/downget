[package]
name = "downget"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "A resilient, privacy-conscious HTTP(S) downloader for macOS"
license = "MIT"

[lib]
name = "downget"
path = "src/lib.rs"

[[bin]]
name = "downget"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.31", features = ["derive"] }
dirs-next = "2.0"
fs2 = "0.4"
futures-util = "0.3"
httpdate = "1.0"
indexmap = "=2.7.0"
reqwest = { version = "=0.11.27", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
sha2 = "=0.10.8"
thiserror = "1.0"
tokio = { version = "=1.43.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "=0.7.17"
url = "=2.4.1"
